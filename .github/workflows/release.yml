name: Publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test release source
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test,fast]"
          python -m pytest
      - name: Verify tag matches package version
        run: >-
          python -c "import os, mbtr;
          expected = f'v{mbtr.__version__}';
          actual = os.environ['GITHUB_REF_NAME'];
          assert actual == expected, f'{actual} does not match {expected}'"
      - name: Build and validate distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --verify-tag \
              --notes-from-tag \
              --title "MBTR $GITHUB_REF_NAME"
          fi

  publish:
    needs: [build, github-release]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/mbtr/
    env:
      HAS_PYPI_CREDENTIALS: ${{ secrets.PYPI_USERNAME != '' && secrets.PYPI_PASSWORD != '' }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - name: Publish through PyPI trusted publishing
        id: trusted-publish
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Fall back to the existing PyPI credentials
        if: steps.trusted-publish.outcome == 'failure' && env.HAS_PYPI_CREDENTIALS == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: ${{ secrets.PYPI_USERNAME }}
          password: ${{ secrets.PYPI_PASSWORD }}
          skip-existing: true
      - name: Report missing PyPI publisher configuration
        if: steps.trusted-publish.outcome == 'failure' && env.HAS_PYPI_CREDENTIALS != 'true'
        run: |
          echo "PyPI rejected trusted publishing and no legacy publishing credentials are configured."
          exit 1
