name: CI

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test,fast]"
      - name: Run tests
        run: python -m pytest --cov=mbtr --cov-report=term-missing

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev,test]"
      - name: Lint
        run: python -m ruff check mbtr tests benchmarks studies examples
      - name: Type check
        run: python -m mypy mbtr

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[docs]"
      - name: Build documentation
        run: python -m sphinx -W --keep-going -b html docs/source docs/_build/html
      - name: Test documentation snippets
        run: python -m sphinx -W --keep-going -b doctest docs/source docs/_build/doctest

  benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[benchmark,fast]"
      - name: Validate benchmark discovery
        run: python -m asv check -E existing

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
      - name: Validate distributions
        run: python -m twine check dist/*
      - name: Install wheel
        run: python -m pip install --force-reinstall dist/*.whl
      - name: Smoke-test installed wheel
        working-directory: /tmp
        run: python -c "import importlib.metadata as m; import mbtr; assert mbtr.__version__ == m.version('mbtr')"
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
